# LSOD-YOLOv11 🚀 (YOLOv11-based Lightweight Small Object Detection)
# Derived from Ultralytics YOLOv11, with LCOR + SPPFL + C2f-N + Dysample integration
# Paper: "LSOD-YOLO: Lightweight Small Object Detection with Attention and Cross-Layer Optimization"
# License: AGPL-3.0

# Parameters
nc: 80  # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# -----------------------------------------------------------------------------
# 🧠 Backbone (based on YOLOv11 backbone)
# - Replaces last SPPF with SPPFL (with LSKA)
# - Keeps P5 output for semantics but LCOR removes redundant detection layer
# -----------------------------------------------------------------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]  # 6
  - [-1, 1, SPPFL, [512, 5]]   # 7 ⬅️ replaced SPPF → SPPFL (with LSKA)
  - [-1, 2, C2PSA, [512]]      # 8 optional C2PSA

# -----------------------------------------------------------------------------
# ⚙️ Neck (LCOR + C2f-N + Dysample)
# - Removes P5 detection branch (LCOR)
# - Adds cross-layer concat from P3→Neck for small object focus
# - C2f-N replaces normal C3k2 blocks (integrated NAM)
# - Dysample module for lightweight dynamic upsampling
# -----------------------------------------------------------------------------
head:
  # Upsample + LCOR skip connection from P4
  - [-1, 1, Dysample, [512, 2]]     # 9: 40x40→80x80
  - [[-1, 4], 1, Concat, [1]]       # 10: DySample + P3
  - [-1, 2, C3k2N, [256]]           # 11: C3k2-NAM (80x80)

  # Upsample + LCOR skip connection from P3
  - [-1, 1, Dysample, [256, 2]]    # 12: 80x80→160x160
  - [[-1, 2], 1, Concat, [1]]       # 13: DySample + P2
  - [-1, 2, C3k2N, [128]]           # 14: C3k2-NAM (160x160)

  # Downsample and fuse again for P4
  - [-1, 1, Conv, [128, 3, 2]]      # 15: 160x160→80x80
  - [[-1, 4, 11], 1, Concat, [1]]      # 16 (Conv↓2 + P3(LCOR) + C3k2-NAM(80x80))
  - [-1, 2, C3k2N, [256]]           # 17: C3k2-NAM (80x80)
  - [-1, 1, Conv, [256, 3, 2]]      # 18: 80x80→40x40
  - [[-1, 8], 1, Concat, [1]]      # 19: (Downsample + C2PSA(512))
  - [-1, 2, C3k2N, [512]]           # 20: C3k2-NAM (40x40)

  - [[14, 17, 20], 1, Detect, [nc]]      # 21: Detect(P2, P3, P4)
